version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: extension-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: usersColsData
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: extension-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=usersColsData
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .env:/app/.env:ro

volumes:
  mongo_data: